name: 每日台股篩選

on:
  schedule:
    # GitHub 排程常延遲好幾小時，所以每段排兩到三次；同一天重跑不會重複買賣
    # 分鐘避開整點（整點最塞）
    - cron: "17 9 * * 1-5"   # 台北 17:17 收盤後
    - cron: "47 11 * * 1-5"  # 台北 19:47 收盤後（備援）
    - cron: "7 1 * * 1-5"    # 台北 09:07 開盤後模擬買進
    - cron: "37 1 * * 1-5"   # 台北 09:37（備援）
    - cron: "27 2 * * 1-5"   # 台北 10:27（備援）
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 收盤後完整執行；open = 開盤後模擬買進；diagnose = 只測試資料來源"
        required: true
        default: run
        type: choice
        options: [run, open, diagnose]
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || (contains(fromJSON('["7 1 * * 1-5","37 1 * * 1-5","27 2 * * 1-5"]'), github.event.schedule) && 'open' || 'run') }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 執行
        env:
          TODAY: ${{ inputs.date }}
        run: node src/main.js $MODE

      - name: 儲存資料與報表
        if: ${{ env.MODE != 'diagnose' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) $MODE"
            git push
          fi
