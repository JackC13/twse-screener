name: 每日台股篩選

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 台北時間 17:30：收盤後篩選、模擬出場、更新 dashboard
    - cron: "10 1 * * 1-5"   # 台北時間 09:10：開盤後用開盤價模擬買進
    # GitHub 排程可能延遲幾十分鐘；開盤價在 09:00 之後就固定了，延遲不影響價格
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 收盤後完整執行；open = 開盤後模擬買進；diagnose = 只測試資料來源"
        required: true
        default: run
        type: choice
        options: [run, open, diagnose]
      date:
        description: "指定日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || (github.event.schedule == '10 1 * * 1-5' && 'open' || 'run') }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 執行
        env:
          TODAY: ${{ inputs.date }}
        run: node src/main.js $MODE

      - name: 儲存資料與報表
        if: ${{ env.MODE != 'diagnose' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) $MODE"
            git push
          fi
